name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Select Rust 1.85
        run: rustup default 1.85.0
      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Compile all tests
        # Golden-vector tests are deliberately red until the extractor exists.
        run: cargo test --workspace --all-targets --locked --no-run
      - name: Check acceptance inventory
        run: cargo test -p uchgs --test acceptance_skeleton --locked

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Scanner releases have their own MSRV; project code remains pinned to Rust 1.85.
      - name: Install scanner toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Select scanner toolchain
        run: rustup default 1.88.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit dependencies
        run: cargo audit --deny warnings
      - name: Check dependency policy
        run: cargo deny --locked check

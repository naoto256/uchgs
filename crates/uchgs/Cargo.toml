# Minimal crate scaffold for the SPEC §16 and Appendix A acceptance tests.
[package]
name = "uchgs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
base64 = "=0.22.1"
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
ed25519-dalek = "=2.2.0"
fs2 = "=0.4.3"
getrandom = "=0.3.4"
hex = "=0.4.3"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
uchgs-windows-fs = { path = "../uchgs-windows-fs", version = "=0.1.0" }

[dev-dependencies]
tempfile = "=3.27.0"
